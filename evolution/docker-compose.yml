# Open-source Evolution API gateway (WhatsApp) — self-hosted local stack.
# Docs: https://docs.evolutionfoundation.com.br
#
#   docker compose up -d          # start gateway + postgres + redis
#   curl http://localhost:8080/   # health check (returns "Evolution API ...")
#
# After startup, create + connect a WhatsApp instance (see README/CONTRIBUTING notes):
#   POST /instance/create  ->  scan the returned QR with WhatsApp on your phone.

services:
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution-api
    restart: unless-stopped
    ports:
      # 9090: backends' 8080 is reserved for the Spring app, so the gateway runs on 9090.
      - "9090:8080"
    environment:
      # Long random secret used for admin + instance auth (mirror in backend/.env EVOLUTION_API_KEY)
      AUTHENTICATION_API_KEY: "${EVOLUTION_AUTH_KEY:-change-me-to-a-long-random-secret}"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: "postgresql"
      DATABASE_CONNECTION_URI: "postgresql://evo:evo@postgres:5432/evolution"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: "redis://redis:6379"
      CACHE_REDIS_PREFIX_KEY: "evolution"
    depends_on:
      - postgres
      - redis
    volumes:
      - evolution_instances:/evolution/instances

  postgres:
    image: postgres:16-alpine
    container_name: evolution-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: evo
      POSTGRES_PASSWORD: evo
      POSTGRES_DB: evolution
    volumes:
      - evolution_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: evolution-redis
    restart: unless-stopped
    volumes:
      - evolution_redis:/data

volumes:
  evolution_pg:
  evolution_redis:
  evolution_instances:
