name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend build & tests (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/revenueRecovery
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build & run tests
        run: mvn -B verify

  frontend:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/recovery-ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/recovery-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & build
        run: npm run build

  docker:
    name: Docker images & compose validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        context: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      # GitHub-hosted ubuntu-latest runners ship Docker + Compose v2 already; do not apt-install it.

      - name: Validate compose file (all-in-one stack)
        run: docker compose config --quiet

      - name: Validate containerized Dockerfile
        working-directory: ${{ matrix.context == 'backend' && 'backend/revenueRecovery' || 'frontend/recovery-ui' }}
        run: docker build -t recovery-${{ matrix.context }}:ci .
