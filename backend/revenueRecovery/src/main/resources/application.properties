server.port=8080

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Razorpay Credentials (Replace with test keys or pass via ENV vars)
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_samplekey123}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:sampleSecretKeyXYZ}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:sampleWebhookSecret456}

# Operator/management API key (X-Admin-Key header). Leave blank to keep admin
# endpoints open for local dev; ALWAYS set in non-local environments.
admin.api-key=${ADMIN_API_KEY:}


# Email Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.enabled=${MAIL_ENABLED:false}
notification.sender.email=${MAIL_FROM:billing@recoveryengine.io}

# Evolution API (open-source WhatsApp/messaging gateway, self-hosted via Docker).
# When enabled (with a reachable instance), sendSmsOrWhatsAppRecovery dispatches a
# real WhatsApp message via POST /message/sendText/{instance}; otherwise it falls
# back to simulation logging. Docs: docs.evolutionfoundation.com.br
evolution.enabled=${EVOLUTION_ENABLED:false}
evolution.base-url=${EVOLUTION_BASE_URL:http://localhost:8080}
evolution.api-key=${EVOLUTION_API_KEY:}
evolution.instance.name=${EVOLUTION_INSTANCE_NAME:recovery-engine}
# Respective API key for the instance (falls back to the global key if blank)
evolution.instance.token=${EVOLUTION_INSTANCE_TOKEN:}


spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/revenue_recovery}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2
spring.flyway.locations=classpath:db/migrations

# With Flyway owning schema, keep Hibernate from silently mutating it. Validate
# ensures the entity mappings stay in sync with the migration-managed schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

