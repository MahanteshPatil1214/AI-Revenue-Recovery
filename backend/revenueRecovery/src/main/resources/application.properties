server.port=8080

# Razorpay Credentials (Replace with test keys or pass via ENV vars)
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_samplekey123}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:sampleSecretKeyXYZ}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:sampleWebhookSecret456}

# H2 Database Config
spring.datasource.url=jdbc:h2:mem:dunningdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Email Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.enabled=${MAIL_ENABLED:false}
notification.sender.email=${MAIL_FROM:billing@recoveryengine.io}

# Twilio Configuration (Disabled / Mock)
twilio.enabled=${TWILIO_ENABLED:false}