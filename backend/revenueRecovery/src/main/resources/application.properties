server.port=8080

# Razorpay Credentials (Replace with test keys or pass via ENV vars)
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_samplekey123}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:sampleSecretKeyXYZ}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:sampleWebhookSecret456}


# Email Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.enabled=${MAIL_ENABLED:false}
notification.sender.email=${MAIL_FROM:billing@recoveryengine.io}

# Twilio Configuration (Disabled / Mock)
twilio.enabled=${TWILIO_ENABLED:false}

# ==========================================
# PostgreSQL Database & Flyway Config
# ==========================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/revenue_recovery}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

